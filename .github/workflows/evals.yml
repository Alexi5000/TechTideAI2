# Eval workflow, runs the eval suite on a schedule and on manual dispatch.
# Does NOT run on pull_request events (cost guard, see docs/EVALS.md).

name: evals

on:
  schedule:
    # Weeknights at 06:00 UTC. Cheap enough at ~$0.30-0.80 per run; schedule is
    # staggered to avoid colliding with other workflows on shared runners.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite id to run (default golden-tasks.v1)"
        required: false
        default: "golden-tasks.v1"
      baseline:
        description: "Baseline run id, 'latest', or 'none'"
        required: false
        default: "latest"
      concurrency:
        description: "Task concurrency (1 = deterministic replay)"
        required: false
        default: "1"
      judge_model:
        description: "LLM judge model id"
        required: false
        default: "gpt-4o"

concurrency:
  group: evals-${{ github.event.inputs.suite || 'golden-tasks.v1' }}
  cancel-in-progress: true

jobs:
  run-evals:
    name: Run eval suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Validate provider configuration
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configure the OPENAI_API_KEY repository secret before running live evaluations."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build dependencies (agents + apis)
        run: |
          pnpm -C apis build
          pnpm -C agents build

      - name: Run eval suite
        id: evals
        env:
          EVAL_DEFAULT_JUDGE_MODEL: ${{ github.event.inputs.judge_model || 'gpt-4o' }}
          SUITE: ${{ github.event.inputs.suite || 'golden-tasks.v1' }}
          BASELINE: ${{ github.event.inputs.baseline || 'latest' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '1' }}
        run: |
          set -e
          EXIT=0
          mkdir -p docs/EVALS
          pnpm --silent -C backend evals --suite "$SUITE" --baseline "$BASELINE" --concurrency "$CONCURRENCY" --judge-model "${EVAL_DEFAULT_JUDGE_MODEL}" --write-docs --json > docs/EVALS/ci-latest.json || EXIT=$?
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          exit ${EXIT:-0}

      - name: Upload eval artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evals-latest
          path: docs/EVALS/ci-latest.json
          if-no-files-found: warn
          retention-days: 30
