name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Detect which workspaces changed
  # ──────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      agents: ${{ steps.filter.outputs.agents }}
      apis: ${{ steps.filter.outputs.apis }}
      python: ${{ steps.filter.outputs.python }}
      database: ${{ steps.filter.outputs.database }}
      contracts: ${{ steps.filter.outputs.contracts }}
      docs: ${{ steps.filter.outputs.docs }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pnpm-lock.yaml'
            frontend:
              - 'frontend/**'
              - 'pnpm-lock.yaml'
            agents:
              - 'agents/src/**'
              - 'agents/package.json'
              - 'pnpm-lock.yaml'
            apis:
              - 'apis/**'
              - 'pnpm-lock.yaml'
            python:
              - 'agents/python/**'
            database:
              - 'database/**'
            contracts:
              - 'contracts/**'
              - 'scripts/sync-contracts.ts'
            docs:
              - 'docs/adr/**'
              - 'docs/posts/**'
              - 'evals/fixtures/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - '.dockerignore'
              - 'frontend/nginx.conf'
              - 'scripts/smoke-stack.sh'

  # ──────────────────────────────────────────────
  # TypeScript: lint + test + build (all workspaces)
  # ──────────────────────────────────────────────
  typescript:
    name: "TS · ${{ matrix.workspace }}"
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.agents == 'true' ||
      needs.changes.outputs.apis == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [apis, agents, backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Env stubs so Zod validation doesn't blow up during build/test
      - name: Create env stubs
        run: |
          echo "NODE_ENV=test" >> backend/.env
          echo "DEFAULT_LLM_PROVIDER=openai" >> backend/.env
          echo "OPENAI_API_KEY=sk-stub-for-ci" >> backend/.env
          echo "ANTHROPIC_API_KEY=sk-ant-stub-for-ci" >> backend/.env

      - name: Lint
        run: pnpm -C ${{ matrix.workspace }} lint

      - name: Typecheck
        run: pnpm -C ${{ matrix.workspace }} exec tsc --noEmit
        # frontend uses tsc -b; handle separately
        if: matrix.workspace != 'frontend'

      - name: Typecheck (frontend)
        run: pnpm -C frontend exec tsc -b --noEmit
        if: matrix.workspace == 'frontend'

      - name: Test
        run: pnpm -C ${{ matrix.workspace }} test -- --run --reporter=default --passWithNoTests
        # Only run if the workspace has test files
        if: matrix.workspace == 'backend' || matrix.workspace == 'apis' || matrix.workspace == 'agents'

      # Build workspace dependencies first (e.g. agents depends on apis, backend depends on apis + agents)
      - name: Build dependencies
        if: matrix.workspace == 'agents' || matrix.workspace == 'backend'
        run: |
          pnpm -C apis build
          if [ "${{ matrix.workspace }}" = "backend" ]; then
            pnpm -C agents build
          fi

      - name: Build
        run: pnpm -C ${{ matrix.workspace }} build

  # ──────────────────────────────────────────────
  # Python agents: lint + test
  # ──────────────────────────────────────────────
  python:
    name: Python agents
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: agents/python/pyproject.toml

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -v

  # ──────────────────────────────────────────────
  # Database migration validation
  # ──────────────────────────────────────────────
  database:
    name: Database migrations
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: latest

      # Validate migration files exist and are ordered
      - name: Validate migrations
        run: |
          MIGRATION_DIR="database/supabase/migrations"
          if [ ! -d "$MIGRATION_DIR" ]; then
            echo "❌ Migration directory not found: $MIGRATION_DIR"
            exit 1
          fi

          FILE_COUNT=$(find "$MIGRATION_DIR" -name "*.sql" | wc -l)
          echo "Found $FILE_COUNT migration file(s):"
          ls -la "$MIGRATION_DIR"/*.sql

          # Check each migration file is non-empty and valid SQL
          for f in "$MIGRATION_DIR"/*.sql; do
            if [ ! -s "$f" ]; then
              echo "❌ Empty migration file: $f"
              exit 1
            fi
            echo "✅ $(basename "$f"), $(wc -l < "$f") lines"
          done

          echo "✅ All migration files validated"

  # ──────────────────────────────────────────────
  # Contract drift, TS ↔ Python shared schema
  # ──────────────────────────────────────────────
  contracts-drift:
    name: Contract drift check
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Re-run sync-contracts and check for diff
        run: |
          set -e
          pnpm tsx scripts/sync-contracts.ts
          if [[ -n "$(git status --porcelain -- agents/src/runtime/contract-types.generated.ts agents/python/src/techtide_agents/contracts/generated.py)" ]]; then
            echo "❌ Drift detected: regenerated contract files differ from those in the PR."
            git --no-pager diff -- agents/src/runtime/contract-types.generated.ts agents/python/src/techtide_agents/contracts/generated.py
            exit 1
          fi
          echo "✅ Contract files are in sync with contracts/schema.json"

  # ──────────────────────────────────────────────
  # Docker, build images and smoke-test the stack
  # ──────────────────────────────────────────────
  docker:
    name: Docker smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t techtideai-backend:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t techtideai-frontend:ci .

      - name: Smoke-test the stack
        env:
          OPENAI_API_KEY: sk-stub-for-ci
          ANTHROPIC_API_KEY: sk-ant-stub-for-ci
        run: bash scripts/smoke-stack.sh

  weaviate-isolation:
    name: Weaviate tenant isolation and migration
    runs-on: ubuntu-latest
    services:
      fresh:
        image: cr.weaviate.io/semitechnologies/weaviate@sha256:7dba0539f640539f83e14bfe4fcf73581a3e3a0c07ff60c3b32f85b3a992e7ed
        ports:
          - 127.0.0.1:18080:8080
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          CLUSTER_HOSTNAME: node1
      legacy:
        image: cr.weaviate.io/semitechnologies/weaviate@sha256:7dba0539f640539f83e14bfe4fcf73581a3e3a0c07ff60c3b32f85b3a992e7ed
        ports:
          - 127.0.0.1:18081:8080
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          CLUSTER_HOSTNAME: node1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Wait for isolated Weaviate instances
        run: |
          for port in 18080 18081; do
            ready=false
            for attempt in {1..60}; do
              if curl -fsS "http://127.0.0.1:${port}/v1/.well-known/ready" >/dev/null; then ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then echo "Weaviate on $port was not ready"; exit 1; fi
          done
      - name: Verify exact tenant isolation
        env:
          TEST_WEAVIATE_URL: http://127.0.0.1:18080
        run: node --test backend/tests/weaviate-search.integration.mjs
      - name: Rehearse legacy migration
        env:
          TEST_WEAVIATE_URL: http://127.0.0.1:18081
        run: node --test backend/tests/weaviate-migration.integration.mjs

  postgres-auth-safety:
    name: Postgres authentication migration safety
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify auth stub and membership grants in disposable databases
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          ready=false
          for attempt in {1..60}; do
            if docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo "Postgres was not ready"; exit 1; fi
          docker cp database/supabase/migrations "$PG_CONTAINER:/migrations"
          docker cp database/supabase/tests "$PG_CONTAINER:/tests"
          docker exec "$PG_CONTAINER" createdb -h 127.0.0.1 -U postgres techtide_auth_stub_test
          docker exec "$PG_CONTAINER" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U postgres -d techtide_auth_stub_test -f /tests/auth-stub-preservation.sql
          docker exec "$PG_CONTAINER" createdb -h 127.0.0.1 -U postgres techtide_membership_test
          docker exec "$PG_CONTAINER" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U postgres -d techtide_membership_test -f /tests/membership-privileges.sql

  # ──────────────────────────────────────────────
  # Gate, all checks must pass before merge
  # ──────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs: [typescript, python, database, contracts-drift, docker, weaviate-isolation, postgres-auth-safety]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "TS:              ${{ needs.typescript.result }}"
          echo "Python:          ${{ needs.python.result }}"
          echo "Database:        ${{ needs.database.result }}"
          echo "Contracts drift: ${{ needs.contracts-drift.result }}"
          echo "Docker:          ${{ needs.docker.result }}"
          echo "Weaviate:        ${{ needs.weaviate-isolation.result }}"
          echo "Postgres auth:    ${{ needs.postgres-auth-safety.result }}"

          # Fail if any required job failed (skipped is OK, means no changes)
          if [[ "${{ needs.typescript.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.python.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.database.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.contracts-drift.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.docker.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.weaviate-isolation.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.postgres-auth-safety.result }}" != "success" ]]; then exit 1; fi

          echo "✅ All checks passed or were skipped"
