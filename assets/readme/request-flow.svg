<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d">
  <title id="t">TechTideAI request flow</title>
  <desc id="d">An operator request goes from the React console to the Fastify API, through the risk classifier, to the Mastra or LangGraph runtime and on to OpenAI or Anthropic. High-risk tiers (external, destructive, billing) pause at a human approval gate; granted runs resume, denied runs fail with the reason kept. Every step writes to the append-only run_events ledger.</desc>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    
    .run { stroke-dasharray: 6 10; animation: run 1.6s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -32; } }
    .tick { animation: tick 2.8s ease-in-out infinite; }
    .tick1 { animation-delay: .4s; } .tick2 { animation-delay: .8s; } .tick3 { animation-delay: 1.2s; } .tick4 { animation-delay: 1.6s; }
    @keyframes tick { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="rf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0b1230"/>
    </linearGradient>
    <radialGradient id="rf-g1" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2de2c5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2de2c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rf-g2" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rf-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="520" rx="20" fill="url(#rf-bg)"/>
  <rect width="1280" height="520" rx="20" fill="url(#rf-grid)"/>
  <rect width="1280" height="520" rx="20" fill="url(#rf-g1)"/>
  <rect width="1280" height="520" rx="20" fill="url(#rf-g2)"/>
  <rect x="0.5" y="0.5" width="1279" height="519" rx="19.5" fill="none" stroke="#22305c"/>
  <defs>
    <marker id="rf-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2c5"/></marker>
    <marker id="rf-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b8b"/></marker>
    <marker id="rf-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker>
    <marker id="rf-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a97b8"/></marker>
  </defs>
  <text x="40" y="52" class="mono" font-size="12" letter-spacing="2.4" fill="#2de2c5">ONE REQUEST, END TO END</text>
  <text x="40" y="84" class="sans" font-size="26" font-weight="700" fill="#e8eefc">Every hop is typed. Every state change is written down.</text>
  <g transform="translate(40 140)">
    <rect width="200" height="92" rx="14" fill="#0e1636" stroke="#5cc8ff" stroke-opacity="0.75"/>
    <rect x="0" y="32.0" width="3" height="28" rx="1.5" fill="#5cc8ff"/>
    <text x="18" y="42.0" class="sans" font-size="15" font-weight="700" fill="#e8eefc">Operator console</text>
    <text x="18" y="61.0" class="mono" font-size="11" fill="#8a97b8">frontend/ · :5180</text>
    <text x="18" y="77.0" class="mono" font-size="11" fill="#5cc8ff">React + Vite</text>
  </g>
  <g transform="translate(290 140)">
    <rect width="200" height="92" rx="14" fill="#0e1636" stroke="#2de2c5" stroke-opacity="0.75"/>
    <rect x="0" y="32.0" width="3" height="28" rx="1.5" fill="#2de2c5"/>
    <text x="18" y="42.0" class="sans" font-size="15" font-weight="700" fill="#e8eefc">Fastify API</text>
    <text x="18" y="61.0" class="mono" font-size="11" fill="#8a97b8">backend/ · :4050</text>
    <text x="18" y="77.0" class="mono" font-size="11" fill="#2de2c5">Zod-validated routes</text>
  </g>
  <g transform="translate(540 140)">
    <rect width="200" height="92" rx="14" fill="#0e1636" stroke="#ffb547" stroke-opacity="0.75"/>
    <rect x="0" y="32.0" width="3" height="28" rx="1.5" fill="#ffb547"/>
    <text x="18" y="42.0" class="sans" font-size="15" font-weight="700" fill="#e8eefc">Risk classifier</text>
    <text x="18" y="61.0" class="mono" font-size="11" fill="#8a97b8">approval-service.ts</text>
    <text x="18" y="77.0" class="mono" font-size="11" fill="#ffb547">tier → gate or go</text>
  </g>
  <g transform="translate(790 140)">
    <rect width="200" height="92" rx="14" fill="#0e1636" stroke="#8b5cf6" stroke-opacity="0.75"/>
    <rect x="0" y="32.0" width="3" height="28" rx="1.5" fill="#8b5cf6"/>
    <text x="18" y="42.0" class="sans" font-size="15" font-weight="700" fill="#e8eefc">Agent runtime</text>
    <text x="18" y="61.0" class="mono" font-size="11" fill="#8a97b8">Mastra (TS)</text>
    <text x="18" y="77.0" class="mono" font-size="11" fill="#8b5cf6">LangGraph sidecar :4051</text>
  </g>
  <g transform="translate(1040 140)">
    <rect width="200" height="92" rx="14" fill="#0e1636" stroke="#ff6b8b" stroke-opacity="0.75"/>
    <rect x="0" y="32.0" width="3" height="28" rx="1.5" fill="#ff6b8b"/>
    <text x="18" y="42.0" class="sans" font-size="15" font-weight="700" fill="#e8eefc">Model providers</text>
    <text x="18" y="61.0" class="mono" font-size="11" fill="#8a97b8">apis/ · LLMProvider</text>
    <text x="18" y="77.0" class="mono" font-size="11" fill="#ff6b8b">OpenAI · Anthropic</text>
  </g>
  <line x1="244" y1="186.0" x2="284" y2="186.0" stroke="#2de2c5" stroke-width="2" class="run" marker-end="url(#rf-t)"/>
  <line x1="494" y1="186.0" x2="534" y2="186.0" stroke="#2de2c5" stroke-width="2" class="run" marker-end="url(#rf-t)"/>
  <line x1="744" y1="186.0" x2="784" y2="186.0" stroke="#2de2c5" stroke-width="2" class="run" marker-end="url(#rf-t)"/>
  <line x1="994" y1="186.0" x2="1034" y2="186.0" stroke="#2de2c5" stroke-width="2" class="run" marker-end="url(#rf-t)"/>
  <path d="M640.0 236 V286" stroke="#ffb547" stroke-width="2" fill="none" stroke-dasharray="5 6" marker-end="url(#rf-a)"/>
  <text x="652.0" y="266" class="mono" font-size="11" fill="#ffb547">external · destructive · billing</text>
  <g transform="translate(470 292)">
    <rect width="340" height="96" rx="14" fill="#ffb547" fill-opacity="0.08" stroke="#ffb547" stroke-opacity="0.8" stroke-dasharray="6 4"/>
    <text x="20" y="32" class="sans" font-size="16" font-weight="700" fill="#e8eefc">Human approval gate</text>
    <text x="20" y="54" class="mono" font-size="11" fill="#8a97b8">run waits · operator grants or denies</text>
    <text x="20" y="74" class="mono" font-size="11" fill="#ffb547">decision stamped with policyVersion</text>
  </g>
  <path d="M814 340.0 H890.0 V238" stroke="#2de2c5" stroke-width="2" fill="none" marker-end="url(#rf-t)"/>
  <text x="826" y="332.0" class="mono" font-size="11" fill="#2de2c5">granted → resume</text>
  <path d="M466 340.0 H262" stroke="#ff6b8b" stroke-width="2" fill="none" marker-end="url(#rf-c)"/>
  <text x="456" y="330.0" text-anchor="end" class="mono" font-size="11" fill="#ff6b8b">denied</text>
  <g transform="translate(70 316.0)"><rect width="186" height="48" rx="24" fill="#ff6b8b" fill-opacity="0.1" stroke="#ff6b8b"/><text x="93" y="21" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#e8eefc">run.failed</text><text x="93" y="37" text-anchor="middle" class="mono" font-size="10" fill="#ff6b8b">reason kept</text></g>
  <g transform="translate(40 440)">
    <rect width="1200" height="52" rx="12" fill="#0a1029" stroke="#22305c"/>
    <text x="20" y="22" class="sans" font-size="14" font-weight="700" fill="#e8eefc">run_events</text>
    <text x="20" y="40" class="mono" font-size="11" fill="#8a97b8">append-only ledger in Supabase · OpenTelemetry spans alongside</text>
    <g class="tick tick1"><rect x="440" y="14" width="103" height="24" rx="12" fill="#2de2c5" fill-opacity="0.12" stroke="#2de2c5" stroke-opacity="0.5"/><text x="452" y="30" class="mono" font-size="11" fill="#2de2c5">run.created</text></g>
    <g class="tick tick2"><rect x="632" y="14" width="154" height="24" rx="12" fill="#2de2c5" fill-opacity="0.12" stroke="#2de2c5" stroke-opacity="0.5"/><text x="644" y="30" class="mono" font-size="11" fill="#2de2c5">approval.requested</text></g>
    <g class="tick tick3"><rect x="824" y="14" width="132" height="24" rx="12" fill="#2de2c5" fill-opacity="0.12" stroke="#2de2c5" stroke-opacity="0.5"/><text x="836" y="30" class="mono" font-size="11" fill="#2de2c5">agent.tool_call</text></g>
    <g class="tick tick4"><rect x="1016" y="14" width="118" height="24" rx="12" fill="#2de2c5" fill-opacity="0.12" stroke="#2de2c5" stroke-opacity="0.5"/><text x="1028" y="30" class="mono" font-size="11" fill="#2de2c5">run.completed</text></g>
  </g>
  <line x1="890.0" y1="236" x2="890.0" y2="436" stroke="#4b5878" stroke-dasharray="2 5"/>
  <line x1="1140.0" y1="236" x2="1140.0" y2="436" stroke="#4b5878" stroke-dasharray="2 5"/>

</svg>
