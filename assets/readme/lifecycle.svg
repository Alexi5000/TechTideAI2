<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
  <title id="t">TechTideAI run lifecycle</title>
  <desc id="d">A run is created queued. The risk classifier either starts it (running) or holds it awaiting approval. Granted approvals resume the run; denied approvals fail it with the reason kept. Running ends in succeeded or failed. Queued or running runs can be canceled. Terminal states have no outgoing transitions.</desc>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="lc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0b1230"/>
    </linearGradient>
    <radialGradient id="lc-g1" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2de2c5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2de2c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lc-g2" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lc-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="380" rx="20" fill="url(#lc-bg)"/>
  <rect width="1280" height="380" rx="20" fill="url(#lc-grid)"/>
  <rect width="1280" height="380" rx="20" fill="url(#lc-g1)"/>
  <rect width="1280" height="380" rx="20" fill="url(#lc-g2)"/>
  <rect x="0.5" y="0.5" width="1279" height="379" rx="19.5" fill="none" stroke="#22305c"/>
  <defs>
    <marker id="lc-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2de2c5"/></marker>
    <marker id="lc-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b8b"/></marker>
    <marker id="lc-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb547"/></marker>
    <marker id="lc-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a97b8"/></marker>
    <marker id="lc-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3e635"/></marker>
  </defs>
  <text x="40" y="52" class="mono" font-size="12" letter-spacing="2.4" fill="#2de2c5">RUN LIFECYCLE</text>
  <text x="40" y="84" class="sans" font-size="26" font-weight="700" fill="#e8eefc">Legal transitions live in one policy. Extend it, never edit it.</text>
  <g transform="translate(40 170)"><rect width="150" height="54" rx="27" fill="#5cc8ff" fill-opacity="0.1" stroke="#5cc8ff" stroke-opacity="0.85"/><text x="75.0" y="26" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#e8eefc">queued</text><text x="75.0" y="42" text-anchor="middle" class="mono" font-size="10" fill="#5cc8ff">run.created</text></g>
  <g transform="translate(250 167)"><path d="M30 0 L60 30 L30 60 L0 30 Z" fill="#ffb547" fill-opacity="0.12" stroke="#ffb547"/><text x="30" y="35" text-anchor="middle" class="mono" font-size="11" fill="#ffb547">risk</text></g>
  <line x1="194" y1="197" x2="246" y2="197" stroke="#8a97b8" stroke-width="2" marker-end="url(#lc-m)"/>
  <g transform="translate(400 170)"><rect width="170" height="54" rx="27" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.85"/><text x="85.0" y="26" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#e8eefc">running</text><text x="85.0" y="42" text-anchor="middle" class="mono" font-size="10" fill="#8b5cf6">run.started</text></g>
  <line x1="314" y1="197" x2="396" y2="197" stroke="#2de2c5" stroke-width="2" marker-end="url(#lc-t)"/>
  <text x="355" y="188" text-anchor="middle" class="mono" font-size="10" fill="#2de2c5">low risk</text>
  <g transform="translate(240 285)"><rect width="230" height="54" rx="27" fill="#ffb547" fill-opacity="0.1" stroke="#ffb547" stroke-opacity="0.85"/><text x="115.0" y="26" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#e8eefc">awaiting approval</text><text x="115.0" y="42" text-anchor="middle" class="mono" font-size="10" fill="#ffb547">run.awaiting-approval</text></g>
  <path d="M280 230 V281" stroke="#ffb547" stroke-width="2" fill="none" marker-end="url(#lc-a)"/>
  <path d="M474 312 H485 V228" stroke="#2de2c5" stroke-width="2" fill="none" marker-end="url(#lc-t)"/>
  <text x="495" y="300" class="mono" font-size="10" fill="#2de2c5">approval.granted</text>
  <g transform="translate(760 118)"><rect width="180" height="54" rx="27" fill="#a3e635" fill-opacity="0.1" stroke="#a3e635" stroke-opacity="0.85"/><text x="90.0" y="26" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#e8eefc">succeeded</text><text x="90.0" y="42" text-anchor="middle" class="mono" font-size="10" fill="#a3e635">run.completed</text></g>
  <g transform="translate(760 222)"><rect width="180" height="54" rx="27" fill="#ff6b8b" fill-opacity="0.1" stroke="#ff6b8b" stroke-opacity="0.85"/><text x="90.0" y="26" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#e8eefc">failed</text><text x="90.0" y="42" text-anchor="middle" class="mono" font-size="10" fill="#ff6b8b">run.failed</text></g>
  <g transform="translate(1040 170)"><rect width="180" height="54" rx="27" fill="#8a97b8" fill-opacity="0.1" stroke="#8a97b8" stroke-opacity="0.85"/><text x="90.0" y="26" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#e8eefc">canceled</text><text x="90.0" y="42" text-anchor="middle" class="mono" font-size="10" fill="#8a97b8">run.canceled</text></g>
  <path d="M574 190 C660 190, 680 145, 756 145" stroke="#a3e635" stroke-width="2" fill="none" marker-end="url(#lc-g)"/>
  <path d="M574 204 C660 204, 680 249, 756 249" stroke="#ff6b8b" stroke-width="2" fill="none" marker-end="url(#lc-c)"/>
  <path d="M474 330 H800 V280" stroke="#ff6b8b" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#lc-c)"/>
  <text x="560" y="348" class="mono" font-size="10" fill="#ff6b8b">approval.denied → failed, reason kept</text>
  <path d="M944 197 H1036" stroke="#8a97b8" stroke-width="2" fill="none" stroke-dasharray="3 5" marker-end="url(#lc-m)"/>
  <text x="1130" y="246" text-anchor="middle" class="mono" font-size="10" fill="#8a97b8">from queued or running</text>
  <text x="1240" y="350" text-anchor="end" class="mono" font-size="11" fill="#4b5878">backend/src/domain/policies/status-transition-policy.ts</text>

</svg>
