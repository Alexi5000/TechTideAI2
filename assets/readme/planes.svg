<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">TechTideAI four planes</title>
  <desc id="d">Product plane: the operator console. Control plane: the director and orchestrators, dispatch and risk classification. Execution plane: workers, tool calls, Mastra and LangGraph runtimes. Evidence plane: run_events, traces, evals and post-mortems. One trace id runs through all four.</desc>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    
    .beam { animation: beam 3s ease-in-out infinite; }
    @keyframes beam { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -60; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="pl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0b1230"/>
    </linearGradient>
    <radialGradient id="pl-g1" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2de2c5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2de2c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pl-g2" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pl-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="470" rx="20" fill="url(#pl-bg)"/>
  <rect width="1280" height="470" rx="20" fill="url(#pl-grid)"/>
  <rect width="1280" height="470" rx="20" fill="url(#pl-g1)"/>
  <rect width="1280" height="470" rx="20" fill="url(#pl-g2)"/>
  <rect x="0.5" y="0.5" width="1279" height="469" rx="19.5" fill="none" stroke="#22305c"/>
  <text x="40" y="52" class="mono" font-size="12" letter-spacing="2.4" fill="#2de2c5">FOUR PLANES</text>
  <text x="40" y="84" class="sans" font-size="26" font-weight="700" fill="#e8eefc">Who decides, who acts, what is recorded, who watches.</text>
  <path d="M236 120 H1240 L1214 190 H210 Z" fill="#5cc8ff" fill-opacity="0.08" stroke="#5cc8ff" stroke-opacity="0.6"/>
  <text x="40" y="150" class="sans" font-size="20" font-weight="800" fill="#5cc8ff">Product</text>
  <text x="40" y="172" class="mono" font-size="11" fill="#4b5878">plane 1 / 4</text>
  <text x="258" y="151" class="sans" font-size="15" fill="#e8eefc">Operator console: agents, runs, evals, approvals, sprints</text>
  <text x="258" y="172" class="mono" font-size="11" fill="#8a97b8">frontend/src/pages/</text>
  <path d="M236 204 H1240 L1214 274 H210 Z" fill="#ffb547" fill-opacity="0.08" stroke="#ffb547" stroke-opacity="0.6"/>
  <text x="40" y="234" class="sans" font-size="20" font-weight="800" fill="#ffb547">Control</text>
  <text x="40" y="256" class="mono" font-size="11" fill="#4b5878">plane 2 / 4</text>
  <text x="258" y="235" class="sans" font-size="15" fill="#e8eefc">Director + orchestrators, dispatch, risk classification</text>
  <text x="258" y="256" class="mono" font-size="11" fill="#8a97b8">agents/src/core/registry.ts</text>
  <path d="M236 288 H1240 L1214 358 H210 Z" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-opacity="0.6"/>
  <text x="40" y="318" class="sans" font-size="20" font-weight="800" fill="#8b5cf6">Execution</text>
  <text x="40" y="340" class="mono" font-size="11" fill="#4b5878">plane 3 / 4</text>
  <text x="258" y="319" class="sans" font-size="15" fill="#e8eefc">Workers, tool calls, Mastra + LangGraph runtimes</text>
  <text x="258" y="340" class="mono" font-size="11" fill="#8a97b8">agents/src/mastra/ · agents/python/</text>
  <path d="M236 372 H1240 L1214 442 H210 Z" fill="#2de2c5" fill-opacity="0.08" stroke="#2de2c5" stroke-opacity="0.6"/>
  <text x="40" y="402" class="sans" font-size="20" font-weight="800" fill="#2de2c5">Evidence</text>
  <text x="40" y="424" class="mono" font-size="11" fill="#4b5878">plane 4 / 4</text>
  <text x="258" y="403" class="sans" font-size="15" fill="#e8eefc">run_events, traces, evals, post-mortems</text>
  <text x="258" y="424" class="mono" font-size="11" fill="#8a97b8">backend/src/services/trace-service.ts</text>
  <line x1="1130" y1="114" x2="1130" y2="448" stroke="#2de2c5" stroke-width="2" stroke-dasharray="10 20" class="beam"/>
  <circle cx="1130" cy="155.0" r="5" fill="#050816" stroke="#2de2c5" stroke-width="2"/>
  <circle cx="1130" cy="239.0" r="5" fill="#050816" stroke="#2de2c5" stroke-width="2"/>
  <circle cx="1130" cy="323.0" r="5" fill="#050816" stroke="#2de2c5" stroke-width="2"/>
  <circle cx="1130" cy="407.0" r="5" fill="#050816" stroke="#2de2c5" stroke-width="2"/>
  <text x="1240" y="84" text-anchor="end" class="mono" font-size="11" fill="#2de2c5">one trace id through every plane</text>

</svg>
