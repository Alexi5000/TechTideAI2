<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" role="img" aria-labelledby="t d">
  <title id="t">Ship, defend, replay</title>
  <desc id="d">Ship on Monday: the FDE installs the harness. Defend on Wednesday: the operator explains a decision. Replay on Friday: the auditor re-runs the record. All three should agree on what happened.</desc>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#0b1230"/>
    </linearGradient>
    <radialGradient id="ft-g1" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2de2c5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2de2c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ft-g2" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ft-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="200" rx="20" fill="url(#ft-bg)"/>
  <rect width="1280" height="200" rx="20" fill="url(#ft-grid)"/>
  <rect width="1280" height="200" rx="20" fill="url(#ft-g1)"/>
  <rect width="1280" height="200" rx="20" fill="url(#ft-g2)"/>
  <rect x="0.5" y="0.5" width="1279" height="199" rx="19.5" fill="none" stroke="#22305c"/>
  <text x="64.0" y="88" class="sans"><tspan font-size="34" font-weight="800" letter-spacing="-1" fill="#5cc8ff">SHIP</tspan><tspan dx="12" font-size="20" fill="#e8eefc">on Monday</tspan></text>
  <text x="64.0" y="118" class="mono" font-size="12" fill="#8a97b8">the FDE installs the harness</text>
  <text x="464.0" y="88" class="sans"><tspan font-size="34" font-weight="800" letter-spacing="-1" fill="#ffb547">DEFEND</tspan><tspan dx="12" font-size="20" fill="#e8eefc">on Wednesday</tspan></text>
  <text x="464.0" y="118" class="mono" font-size="12" fill="#8a97b8">the operator explains a decision</text>
  <line x1="440.0" y1="56" x2="440.0" y2="132" stroke="#22305c"/>
  <text x="864.0" y="88" class="sans"><tspan font-size="34" font-weight="800" letter-spacing="-1" fill="#2de2c5">REPLAY</tspan><tspan dx="12" font-size="20" fill="#e8eefc">on Friday</tspan></text>
  <text x="864.0" y="118" class="mono" font-size="12" fill="#8a97b8">the auditor re-runs the record</text>
  <line x1="840.0" y1="56" x2="840.0" y2="132" stroke="#22305c"/>
  <text x="640" y="172" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#4b5878">ALL THREE SHOULD AGREE ON WHAT HAPPENED</text>

</svg>
